# mad-icp default params
b_max : 0.2 # [m] max size of kd leaves
b_min : 0.1 # [m] when a node is flatten than this param, propagate normal
b_ratio : 0.02 # the increase factor of search radius needed in data association 
p_th : 0.8 # [%] ensuring an update when the curr point cloud is registered less than this param
rho_ker : 0.1 # huber threshold in mad-icp
n : 10 # the number of last poses to smooth velocity
solver : gsolver  # metodo di stima velocità: classic | gsolver | gtsam
qc_default : 0.5  # intensità del rumore di processo WNOA (default 0.5)
gt_path :  # percorso GT KITTI per calibrare Qc (vuoto = usa default 1e-2*I)
prior_cov : 1e-3  # covarianza del prior factor sulle pose (solver gsolver | gtsam). Vuoto = usa la covarianza ICP reale per-posa
gn_iterations : 30  # numero di iterazioni GN/GBP del factor graph (solver gsolver | gtsam)
